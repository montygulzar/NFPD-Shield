# Alembic configuration for NFPD Shield.
#
# The database URL is NOT stored here. migrations/env.py reads DATABASE_URL
# from the process environment so credentials never live in the repository.
# Override on the command line when needed:
#   alembic -x url=postgresql+asyncpg://... upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Timestamped, sortable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
