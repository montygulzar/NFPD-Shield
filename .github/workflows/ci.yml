name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shield
          POSTGRES_PASSWORD: shield
          POSTGRES_DB: nfpd_shield_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://shield:shield@127.0.0.1:5432/nfpd_shield_test
      SHIELD_TEST_PG_URL: postgresql+asyncpg://shield:shield@127.0.0.1:5432/nfpd_shield_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "psycopg2-binary>=2.9"

      - name: Lint
        run: ruff check shield tests migrations

      - name: Shell script syntax
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done

      - name: Migrations round-trip
        run: |
          alembic upgrade head
          alembic current
          alembic downgrade base
          alembic upgrade head

      - name: Tests (includes the PostgreSQL-specific suite)
        run: pytest -q

      - name: Config validation fails loudly without secrets
        run: |
          set +e
          env -i "PATH=$PATH" python -m shield > /tmp/out.txt 2>&1
          code=$?
          set -e
          echo "exit code: $code"
          cat /tmp/out.txt
          test "$code" -eq 78
          grep -q "DISCORD_TOKEN is required" /tmp/out.txt

  docker:
    name: container build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Compose file renders
        run: |
          # env_file must exist for `compose config` to resolve; the values are
          # never used, and .env is excluded from the build context anyway.
          printf 'DISCORD_TOKEN=x\nAPPLICATION_ID=1\n' > .env
          docker compose config
          rm -f .env

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nfpd-shield:ci
          build-args: |
            APP_VERSION=ci
            GIT_COMMIT=${{ github.sha }}

      - name: Image runs as a non-root user and reports its build
        run: |
          test "$(docker run --rm nfpd-shield:ci id -u)" = "10002"
          docker run --rm nfpd-shield:ci python -c "import shield, aiohttp; print(shield.__name__)"
          docker run --rm nfpd-shield:ci sh -c 'echo "$APP_VERSION $GIT_COMMIT"'

      - name: Entrypoint refuses to start without configuration
        run: |
          set +e
          out=$(docker run --rm nfpd-shield:ci 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "DISCORD_TOKEN is required"

      - name: Healthcheck probe fails closed when nothing is listening
        run: |
          set +e
          docker run --rm nfpd-shield:ci python healthcheck.py
          code=$?
          set -e
          test "$code" -eq 1
